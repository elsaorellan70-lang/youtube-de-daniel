<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050806">
  <!-- v5: preconnect = menos latencia en primera carga móvil -->
  <link rel="preconnect" href="https://www.googleapis.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://s.ytimg.com">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com;
                 frame-src https://www.youtube.com; connect-src 'self' https://www.googleapis.com;
                 style-src 'self';
                 img-src 'self' data: https://i.ytimg.com https://i.pravatar.cc https://storage.googleapis.com https://commondatastorage.googleapis.com;
                 media-src 'self' https://commondatastorage.googleapis.com;
                 object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>NeonTube — tu YouTube, tu estilo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="topProgress" hidden></div>

  <header class="topbar glass">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
    </span>
    <h1 class="brand">Neon<span>Tube</span></h1>
    <span class="spacer"></span>
    <button class="icon-btn" id="btnSettings" type="button" aria-label="Ajustes y API key">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
    </button>
    <button class="icon-btn" id="btnQueueTop" type="button" aria-label="Ver cola">
      <svg viewBox="0 0 24 24"><path d="M4 6h12M4 12h12M4 18h8"/><path d="M17 14l4 2.5-4 2.5z" fill="currentColor" stroke="none"/></svg>
    </button>
    <img class="avatar" src="https://i.pravatar.cc/96?img=12" alt="Tu avatar" width="38" height="38" loading="lazy">
  </header>

  <section class="searchbar glass" role="search">
    <span class="icon neon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
    </span>
    <input id="searchInput" type="search" placeholder="Busca en YouTube: artistas, temas, canales…"
           autocomplete="off" enterkeyhint="search" maxlength="80" aria-label="Buscar en YouTube">
    <button class="icon-btn" id="btnClear" type="button" aria-label="Limpiar búsqueda">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="icon-btn neon-fill" id="btnShuffle" type="button" aria-label="Reproducción aleatoria">
      <svg viewBox="0 0 24 24"><path d="M4 6h4l8 12h4M4 18h4l8-12h4"/><path d="M18 4l2 2-2 2M18 16l2 2-2 2"/></svg>
    </button>
  </section>

  <nav class="chips" id="chips" aria-label="Categorías"></nav>

  <div id="demoNote" class="note glass" hidden></div>

  <main id="feed" class="feed" aria-live="polite"></main>

  <button class="pill neon-outline more" id="btnMore" type="button" hidden>Cargar más resultados</button>

  <div id="mini" class="mini glass" hidden>
    <img id="mThumb" src="" alt="" width="44" height="44">
    <div class="m-txt"><strong id="mTitle">—</strong><span id="mChannel">—</span></div>
    <button class="icon-btn" id="mPlay" type="button" aria-label="Pausar o reanudar">
      <svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-btn" id="mExpand" type="button" aria-label="Expandir reproductor">
      <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <button class="icon-btn" id="mClose" type="button" aria-label="Detener">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <span class="m-bar"><i id="mBarFill"></i></span>
  </div>

  <section id="player" class="player" hidden aria-label="Reproductor">
    <header class="p-head glass">
      <button class="icon-btn" id="btnMinimize" type="button" aria-label="Minimizar">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="p-titles"><strong id="pTitle">—</strong><span id="pChannel">—</span></div>
      <button class="icon-btn" id="btnAudioOnly" type="button" aria-label="Modo solo audio" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
      </button>
      <button class="icon-btn" id="btnClosePlayer" type="button" aria-label="Cerrar reproductor">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="p-stage" id="pStage">
      <video id="video" playsinline preload="metadata" hidden></video>
      <div id="ytHost"></div>
      <div id="stageSpinner" class="spinner" hidden></div>
      <div class="gfx" id="gfxLeft" hidden>
        <svg viewBox="0 0 24 24"><path d="M11 6l-6 6 6 6M18 6l-6 6 6 6"/></svg><span>−10 s</span>
      </div>
      <div class="gfx" id="gfxRight" hidden>
        <svg viewBox="0 0 24 24"><path d="M13 6l6 6-6 6M6 6l6 6-6 6"/></svg><span>+10 s</span>
      </div>
    </div>
    <img id="pArt" class="p-art" src="" alt="" hidden>

    <div class="p-ui">
      <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Progreso">
      <div class="p-times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      <div class="p-controls">
        <button class="icon-btn" id="btnPrev" type="button" aria-label="Anterior">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM18 6l-8 6 8 6z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="play-btn" id="btnPlay" type="button" aria-label="Reproducir">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="btnNext" type="button" aria-label="Siguiente">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8 6-8 6z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="pill" id="btnRate" type="button" aria-label="Velocidad">1x</button>
        <button class="pill" id="btnQuality" type="button" aria-label="Calidad de vídeo">HD</button>
        <button class="icon-btn" id="btnFull" type="button" aria-label="Pantalla completa">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 15v5h5M20 9V4h-5"/></svg>
        </button>
      </div>
      <div class="p-actions">
        <button class="pill neon-outline" id="btnQueueAdd" type="button">+ Añadir a la cola</button>
        <span class="pill" id="pPos">0/0</span>
      </div>
    </div>

    <div class="upnext">
      <h3>A continuación</h3>
      <div id="upNextList" class="uplist"></div>
    </div>

    <div id="qualityMenu" class="qmenu glass" hidden role="menu" aria-label="Calidad de vídeo"></div>
  </section>

  <nav class="bottomnav glass" id="bottomnav" aria-label="Navegación principal">
    <button class="tab" data-tab="feed" type="button" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span>Inicio</span>
    </button>
    <button class="tab" data-tab="queue" type="button" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h12M4 12h12M4 18h8"/><path d="M17 14l4 2.5-4 2.5z" fill="currentColor" stroke="none"/></svg>
      <span>Cola</span><em class="badge" id="queueBadge" hidden>0</em>
    </button>
    <button class="tab" data-tab="music" type="button" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/></svg><span>Música</span>
    </button>
    <button class="tab" data-tab="explore" type="button" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5l-2 5-3 1 2-5z" fill="currentColor" stroke="none"/></svg><span>Explorar</span>
    </button>
  </nav>

  <div id="modal" class="overlay" hidden>
    <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="mHead">
      <h2 id="mHead">Ajustes</h2>
      <label for="apiKeyInput">API Key — YouTube Data API v3
        <input id="apiKeyInput" type="password" inputmode="text" autocomplete="off"
               spellcheck="false" maxlength="60" placeholder="AIza…">
      </label>
      <p class="hint">La clave se guarda <strong>solo en este dispositivo</strong>. Si un día publicas el dominio, restríngela por <em>referidor HTTP</em> en Google Cloud.</p>
      <div class="m-actions">
        <button class="pill neon-outline" id="btnSaveKey" type="button">Guardar</button>
        <button class="pill" id="btnClearKey" type="button">Borrar</button>
        <button class="pill" id="btnCloseModal" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast glass" role="status" aria-live="polite" hidden></div>
</div>
<script src="app.js" defer></script>
</body>
</html>
